name: Build FishFinder Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishFinder-ROV-App
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Update GitHub Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.3.0
          name: FishFinder ROV Mobile App v1.3.0
          body: |
            ## 🐟 FishFinder ROV Mobile App v1.3.0
            
            ### ✨ Features Included:
            - **Complete Standalone App**: Bundled offline frontend assets with instant zero-second launch.
            - **Modern AndroidX Foundation**: Stable on Android 8 through Android 15.
            - **Touch Gestures on Live Video**:
              - Swipe Left / Right to Pan (auto-stop on release)
              - Swipe Up / Down to Tilt
            - **Laptop App Features**:
              - 📸 Snapshot (Capture photo directly to phone)
              - 🎥 In-App Video Recording with live duration timer
              - 🌊 Underwater Mode (color correction matrix)
              - 🌙 Low Light / Night Boost
              - 🎛️ Digital Zoom (1x to 3x), Brightness, Contrast & Saturation sliders
              - 🕹️ Full D-Pad & Precision Joystick Sliders
            - **Configurable Host IP**: Defaults to `192.168.0.131` with in-app changer.
          files: app/build/outputs/apk/debug/app-debug.apk
